<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jmfighter3-cpu의 GitHub Pages</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      max-width: 600px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      padding: 40px;
      text-align: center;
      border: 1px solid #e2e8f0;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background-color: #e0f2fe;
      color: #0284c7;
      font-size: 14px;
      font-weight: 600;
      border-radius: 9999px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #0f172a;
    }
    p {
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 24px;
      font-size: 16px;
    }
    .links {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #1d4ed8;
    }
    .btn-secondary {
      background-color: #f1f5f9;
      color: #334155;
    }
    .btn-secondary:hover {
      background-color: #e2e8f0;
    }
    footer {
      margin-top: 24px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">🚀 GitHub Pages 배포 완료</span>
    <h1>환영합니다!</h1>
    <p>
      <strong>jmfighter3-cpu</strong>님의 GitHub Pages 웹사이트가 성공적으로 연동되었습니다.<br>
      이 페이지를 수정하여 나만의 블로그나 포트폴리오를 만들어보세요.
    </p>
    <div class="links">
      <a href="https://github.com/jmfighter3-cpu/jmfighter3-cpu.github.io" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">
        GitHub 저장소 바로가기
      </a>
    </div>
  </div>
  <footer>
    &copy; 2026 jmfighter3-cpu. Powered by GitHub Pages.
  </footer>
</body>
</html>
