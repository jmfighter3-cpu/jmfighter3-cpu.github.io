<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 문자 인코딩을 UTF-8(한글 깨짐 방지)로 지정합니다 -->
  <meta charset="UTF-8">
  <!-- 모바일과 PC 화면 비율을 알맞게 맞춰주는 반응형 뷰포트 설정입니다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 첫 번째 웹페이지</title>
  <style>
    /* 전체 배경과 기본 글꼴 설정 */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333333;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    /* 본문을 깔끔하게 감싸주는 흰색 카드 영역 */
    .container {
      background-color: #ffffff;
      max-width: 600px;
      width: 100%;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #2b6cb0;
      margin-top: 0;
    }
    h2 {
      color: #4a5568;
      font-size: 1.2rem;
      margin-top: 20px;
    }
    p {
      line-height: 1.6;
    }
    ul {
      line-height: 1.8;
      padding-left: 20px;
    }
    a {
      color: #3182ce;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- 웹페이지의 주요 내용을 담는 본문 영역입니다 -->
  <div class="container">
    <h1>안녕하세요! 👋</h1>
    <p>저의 첫 GitHub Pages 웹사이트에 오신 것을 환영합니다.</p>
    
    <h2>💡 소개</h2>
    <p>이곳은 HTML을 배우고 나만의 페이지를 만들어가는 공간입니다.</p>

    <h2>🎯 앞으로 해보고 싶은 것</h2>
    <ul>
      <li>나만의 온라인 이력서 / 포트폴리오 만들기</li>
      <li>좋아하는 글과 프로젝트 기록하기</li>
      <li>멋진 웹 디자인 직접 꾸며보기</li>
    </ul>

    <hr style="margin: 24px 0; border: none; border-top: 1px solid #e2e8f0;">

    <p>
      더 많은 정보는 
      <a href="https://github.com/jmfighter3-cpu" target="_blank">내 GitHub 프로필</a>
      에서 확인하실 수 있습니다.
    </p>
  </div>

</body>
</html>
